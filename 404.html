<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  /* GitHub Pages muestra esta página cuando una dirección no existe.
     Si la dirección es de una campaña (/producciones/nombre), la manda a la
     página de Producciones, que muestra esa campaña con su dirección linda. */
  (function(){
    var p = location.pathname, i = p.indexOf('/producciones/');
    var raiz = i > -1 ? p.slice(0, i) : '';
    if (i > -1){
      var slug = p.slice(i + 14).replace(/\/+$/, '').split('/')[0];
      if (slug){ location.replace(raiz + '/producciones/?c=' + encodeURIComponent(decodeURIComponent(slug)) + location.hash); }
    }
    document.write('<base href="' + raiz + '/">');
  })();
</script>
<title>Página no encontrada · Kenai Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  .nf .ghost{display:inline-flex;align-items:center;min-height:44px;padding:0 22px;border-radius:999px;border:1px solid rgba(244,239,230,.3);text-decoration:none;font-weight:600;font-size:15px}
</style>
</head>
<body>

    <svg viewBox="0 40 200 105" aria-hidden="true"><circle cx="100" cy="74" r="24" fill="#C8402F"/><path d="M10 140 L70 58 L100 96 L132 46 L190 140 Z" fill="#F4EFE6"/></svg>
